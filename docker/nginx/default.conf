server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    # Use Docker's embedded DNS so the backend upstream is re-resolved at
    # request time. Without this, nginx caches the backend's IP at startup and
    # breaks with 502s whenever the backend container restarts on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Assigning to a variable forces per-request resolution via the
        # resolver above (a literal fastcgi_pass would cache the IP).
        set $upstream_php backend:9000;
        fastcgi_pass $upstream_php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Allow larger AI responses / uploads
        fastcgi_read_timeout 120;
        internal;
    }

    # Return 404 for all other .php files
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 8m;
    error_log /dev/stderr;
    access_log /dev/stdout;
}
