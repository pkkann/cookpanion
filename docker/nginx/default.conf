# Map the Upgrade header so websocket connections (Vite HMR) pass through,
# while normal requests get "Connection: close". Declared in the http context
# (conf.d files are included there).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Use Docker's embedded DNS so upstreams are re-resolved at request time.
    # Without this, nginx caches a container's IP at startup and breaks with
    # 502s whenever that container restarts on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Backend API (Symfony via php-fpm) -----------------------------------
    # Everything under /api is handled by the Symfony front controller. Keeping
    # the /api prefix in the path matches the app's route definitions.
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Assigning to a variable forces per-request resolution via the
        # resolver above (a literal fastcgi_pass would cache the IP).
        set $upstream_php backend:9000;
        fastcgi_pass $upstream_php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Allow larger AI responses / uploads
        fastcgi_read_timeout 120;
        internal;
    }

    # Return 404 for all other .php files
    location ~ \.php$ {
        return 404;
    }

    # --- Frontend (Vite dev server) ------------------------------------------
    # Everything else is proxied to the Vite container. This makes the SPA and
    # the API share a single origin, so the frontend can call "/api" relatively
    # — no baked-in host/IP, and no CORS. The Upgrade headers keep Vite's HMR
    # websocket working through the proxy.
    location / {
        set $upstream_front frontend:5173;
        proxy_pass http://$upstream_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 8m;
    error_log /dev/stderr;
    access_log /dev/stdout;
}

# --- Adminer (SQLite browser) --------------------------------------------
# Separate port so it's never reachable through the app origin (or a tunnel
# pointed at it). Password-gated via DB_ADMIN_PASSWORD; empty = disabled.
server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_php backend:9000;
        fastcgi_pass $upstream_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/adminer;
        fastcgi_read_timeout 120;
    }
}
