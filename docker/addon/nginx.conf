server {
    listen 80;
    server_name _;

    root /var/www/spa;
    index index.html;

    # AI recipe import posts ~7 MB base64 images as JSON.
    client_max_body_size 16m;

    location /api {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
    }

    # Vite emits content-hashed filenames under /assets — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and app shell must always revalidate, or updates
    # would never reach installed PWAs.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /registerSW.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA fallback: client-side routes all serve the app shell.
    location / {
        try_files $uri /index.html;
    }
}

# --- Adminer (SQLite browser) --------------------------------------------
# Served two ways, both password-gated via the db_admin_password option
# (empty = nobody can log in): HA ingress (sidebar panel, HA auth in front)
# and the optional direct host port. Never reachable through the app port.
server {
    listen 8081;
    server_name _;

    # Ingress serves this under a token path prefix; relative redirects keep
    # Adminer's query-string navigation working there.
    absolute_redirect off;

    location / {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/adminer/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/adminer;
        fastcgi_read_timeout 120;
    }
}
