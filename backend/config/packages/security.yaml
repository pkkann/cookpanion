security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Load users from the database by their email address.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # With two authenticators, Symfony needs to know which one handles an
            # unauthenticated request — Lexik's returns the 401 JSON entry point.
            entry_point: jwt
            # Lexik's authenticator only "supports" requests carrying a Bearer token,
            # so /auth/google (which sends none) passes through anonymously.
            jwt: ~
            # Exchanges a valid refresh token (POSTed to check_path) for a fresh
            # access token. The authenticator intercepts this path during the
            # firewall phase and returns { token, refresh_token }.
            refresh_jwt:
                check_path: /api/token/refresh

    # Note: only the *first* matching rule is applied.
    access_control:
        - { path: ^/api/config, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
