services:
  database:
    image: mariadb:11.4
    container_name: recipe_ai_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-recipe_ai}
      MARIADB_USER: ${MARIADB_USER:-recipe}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-recipe}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./docker/php
    container_name: recipe_ai_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-changeme_dev_secret}
      LOAD_FIXTURES: ${LOAD_FIXTURES:-false}
      DATABASE_URL: "mysql://${MARIADB_USER:-recipe}:${MARIADB_PASSWORD:-recipe}@database:3306/${MARIADB_DATABASE:-recipe_ai}?serverVersion=11.4.2-MariaDB&charset=utf8mb4"
      # AI / Claude — token supplied later by the user
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      # Google sign-in — public Web client id (no secret). Empty = feature disabled.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # CORS origin for the SPA
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://localhost:(5173|3000)$}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-jwt_dev_passphrase}
    volumes:
      - ./backend:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    container_name: recipe_ai_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    # Single front door for the whole app: serves the SPA and proxies /api to
    # the backend on one origin. Reach it at http://<any-host>:5173.
    ports:
      - "${APP_HOST_PORT:-5173}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: node:22-alpine
    container_name: recipe_ai_frontend
    working_dir: /app
    environment:
      # Relative path: the SPA is served on the same origin as the API (via
      # nginx), so no host/IP is baked in. Works from localhost, LAN IP, etc.
      VITE_API_URL: ${VITE_API_URL:-/api}
      # Same Google Web client id the backend uses (public). Empty = button hidden.
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    # No published port: the frontend is reached only through nginx (single
    # origin). The Vite server still listens on 5173 inside the network.
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  db_data:
  frontend_node_modules:
