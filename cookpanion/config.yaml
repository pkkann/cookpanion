name: Cookpanion
slug: cookpanion
description: Plan meals, track your kitchen stock, and cook with what you have.
version: "1.4.1"
url: https://github.com/pkkann/recipe_ai
arch:
  - amd64
  - aarch64
# Prebuilt multi-arch image pushed by .github/workflows/addon-image.yml.
# The tag must match `version` above.
image: ghcr.io/pkkann/cookpanion
init: false
ports:
  80/tcp: 8099
  8081/tcp: 8100
ports_description:
  80/tcp: Web UI (direct access, no ingress)
  8081/tcp: Adminer database browser, direct LAN access (optional — also available via the sidebar panel; requires db_admin_password)
webui: http://[HOST]:[PORT:80]
# Ingress serves ADMINER (not the app) as an HA sidebar panel: HA's own auth
# in front, admin users only, works under HTTPS. The app itself stays on the
# direct port — its SPA routing and PWA don't survive ingress path prefixes.
ingress: true
ingress_port: 8081
panel_icon: mdi:database
panel_title: Cookpanion DB
panel_admin: true
options:
  google_client_id: ""
  anthropic_api_key: ""
  ai_model: claude-sonnet-4-5
  allow_registration: true
  db_admin_password: ""
schema:
  google_client_id: str?
  anthropic_api_key: password?
  ai_model: str?
  allow_registration: bool?
  db_admin_password: password?
